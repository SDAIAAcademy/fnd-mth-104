<script type="application/json" id="academy-data">{"v":1,"engine":"1.0.0","build":{"at":"2026-11-25T08:32:01Z","version":"2027.1.0","commit":"0b561fb"},"course":{"id":"fnd-mth-104","code":"FND-MTH-104","title":"Statistics by Simulation: Variation, Estimation and Testing","track":"foundations","lang":"en","dir":"ltr","url":"https://sdaiaacademy.github.io/fnd-mth-104/","repo":"SDAIAAcademy/fnd-mth-104","home":"index.html","outcomes":[{"id":"LO1","text":"Distinguish population, sample, parameter, statistic and sampling distribution, and explain what a standard error measures, given repeated samples from a known synthetic population"},{"id":"LO2","text":"Explain what p-values and confidence intervals mean and identify misreadings of them, given ten statements from synthetic reports"},{"id":"LO3","text":"Identify multiple-testing, forking-path and confounding problems in a reported analysis, given a one-page synthetic summary"},{"id":"LO4","text":"Compute bootstrap intervals for means, medians, group differences and regression slopes, given public data with skewed variables"},{"id":"LO5","text":"Implement permutation tests and report each result as an effect size with an interval, given two public datasets and stated questions"},{"id":"LO6","text":"Apply family-wise and false-discovery-rate corrections and measure by simulation how often uncorrected tests produce false findings, given twenty outcomes with no true effect"}],"unit":"week","units":[{"n":1,"id":"week1","label":"Week 1","title":"Describing data","sessions":[{"n":1,"label":"Session 1","title":"Centre, spread, shape and missing values"}]},{"n":2,"id":"week2","label":"Week 2","title":"Sampling variation","sessions":[{"n":1,"label":"Session 1","title":"Populations, samples and standard error"}]},{"n":3,"id":"week3","label":"Week 3","title":"Observational and experimental data","sessions":[{"n":1,"label":"Session 1","title":"Confounding and Simpson's paradox"}]},{"n":4,"id":"week4","label":"Week 4","title":"The bootstrap","sessions":[{"n":1,"label":"Session 1","title":"The bootstrap and its coverage"}]},{"n":5,"id":"week5","label":"Week 5","title":"Intervals for differences and slopes","sessions":[{"n":1,"label":"Session 1","title":"Differences and slopes"}]},{"n":6,"id":"week6","label":"Week 6","title":"Permutation tests","sessions":[{"n":1,"label":"Session 1","title":"Null models, p-values and effect sizes"}]},{"n":7,"id":"week7","label":"Week 7","title":"Many tests and forking paths","sessions":[{"n":1,"label":"Session 1","title":"Multiple testing and false discoveries"}]},{"n":8,"id":"week8","label":"Week 8","title":"Error rates, power and honest reporting","sessions":[{"n":1,"label":"Session 1","title":"Type I and II errors, power and reporting"}]},{"n":9,"id":"capstone","label":"Capstone","title":"Capstone oral checks","sessions":[]}]},"ai":{"context":{"course":"context/course.md","courseJs":"context/course.js","day":null,"llms":"llms.txt"},"tasks":[],"tools":[]},"features":{},"strings":{},"questions":[{"id":"check-centre-q1","type":"single","prompt":"The finance analyst must forecast next month's total delivery charges from this month's 2,000 deliveries, whose charges have a long right tail. Which summary of this month's charges does the forecast need?","options":[{"key":"A","text":"The median charge"},{"key":"B","text":"The 20% trimmed mean charge"},{"key":"C","text":"The mean charge"},{"key":"D","text":"The interquartile range of the charges"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A total is the mean times the count; the tail contributes to the total, so the mean is the summary that adds up.","misconceptions":["Uses the typical value for a total: the median ignores how large the tail is, and the tail is real money","Drops the largest charges, which will be billed again next month","","Confuses spread with level: the interquartile range says nothing about the total"],"lo":["LO4"],"day":1,"session":1,"slide":{"deck":"week1","id":"check-centre","title":"Which summary for this request?"},"level":null,"pool":"checkpoint"},{"id":"check-outlier-q1","type":"single","prompt":"A month of 3,000 coffee orders has a high fence of 31 riyals. Forty orders lie above it, the largest 96 riyals for 14 drinks at a branch next to an office block. What do you do?","options":[{"key":"A","text":"Keep it: value per drink is ordinary, so it is a real large order"},{"key":"B","text":"Delete all forty orders above the fence"},{"key":"C","text":"Replace it with the fence value, 31"},{"key":"D","text":"Delete it, because it will distort the median"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"96 / 14 is under 7 riyals a drink: nothing suggests an error, so it stays.","misconceptions":["","Treats the fence as a deletion rule: it only flags values to inspect","Replaces a real value with an invented one, which biases totals downwards","Thinks the median needs cleaning first: the median is robust to a few large values anyway"],"lo":["LO4"],"day":1,"session":1,"slide":{"deck":"week1","id":"check-outlier","title":"What do you do with this order?"},"level":null,"pool":"checkpoint"},{"id":"check-missing-q1","type":"single","prompt":"A delivery service logs delivery times by hand. Drivers often skip the log when they are running late. The median of the logged times is 28 minutes. What is the most likely relation to the true median?","options":[{"key":"A","text":"About the same, since a median ignores missing rows"},{"key":"B","text":"The true median is lower than 28 minutes"},{"key":"C","text":"Impossible to say, because medians are robust"},{"key":"D","text":"The true median is higher than 28 minutes"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Late deliveries are the ones not logged, so the logged times are the shorter ones.","misconceptions":["Assumes the gaps are random: here they are linked to the value itself","Gets the direction backwards: the missing times are the long ones","Thinks a robust summary is immune to missing data: robustness is about extreme values, not about who is missing",""],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"week1","id":"check-missing","title":"Which way does the bias run?"},"level":null,"pool":"checkpoint"},{"id":"review-week1-q1","type":"single","prompt":"Eleven parcel weights have a median of 2.4 kg. Which single change can move the median?","options":[{"key":"A","text":"Doubling the heaviest parcel"},{"key":"B","text":"Halving the lightest parcel"},{"key":"C","text":"Adding two more parcels, both heavier than 2.4 kg"},{"key":"D","text":"Rounding every weight to one decimal"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Two values above the middle shift which parcel is in the middle: the median moves up or stays, depending on the next value.","misconceptions":["Thinks the median tracks the largest value: only the order of the middle values matters","Thinks any edit to the tail reaches the middle: the lightest parcel stays below the median","","Thinks rounding reorders the values: a median of 2.4 kg is already at one decimal and rounding keeps the order"],"lo":["LO4"],"day":2,"session":null,"slide":{"deck":"week2","id":"review-week1","title":"Which change moves the median?"},"level":null,"pool":"checkpoint"},{"id":"check-vocabulary-q1","type":"single","prompt":"An auditor checks 80 of a branch's 1,200 invoices for the month and finds 6 with errors. Which of these is a statistic?","options":[{"key":"A","text":"The share of errors among the 80 checked, 7.5%"},{"key":"B","text":"The 1,200 invoices of the month"},{"key":"C","text":"The share of errors among all 1,200 invoices"},{"key":"D","text":"The number of invoices checked, 80"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A statistic is computed from the sample; 6 / 80 = 7.5% would differ for another 80 invoices.","misconceptions":["","Names the population size, a fixed count, not something computed from the sample","Names the parameter: the error share of all 1,200 is what the sample estimates","Confuses the design choice with a result: the sample size is chosen, not computed"],"lo":["LO1"],"day":2,"session":1,"slide":{"deck":"week2","id":"check-vocabulary","title":"Which number is a statistic?"},"level":null,"pool":"checkpoint"},{"id":"check-se-q1","type":"single","prompt":"Weighing 25 croissants gives a standard error of 2 g for the mean weight. The quality lead wants a standard error of 1 g. About how many croissants must she weigh?","options":[{"key":"A","text":"50"},{"key":"B","text":"100"},{"key":"C","text":"400"},{"key":"D","text":"25, but weighed more carefully"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Halving the standard error needs four times the sample: 4 × 25 = 100.","misconceptions":["Assumes the standard error falls in proportion to n: it falls with the square root","","Squares the ratio twice","Thinks the standard error depends only on the spread of weights, not on n"],"lo":["LO1"],"day":2,"session":1,"slide":{"deck":"week2","id":"check-se","title":"How many more croissants?"},"level":null,"pool":"checkpoint"},{"id":"check-frame-q1","type":"single","prompt":"A gym estimates members' weekly visits from 5,000 check-ins logged by its entrance machine, which records only members who use the app to enter. What is the main weakness?","options":[{"key":"A","text":"The sample is too small for a stable mean"},{"key":"B","text":"Visit counts have a large standard deviation"},{"key":"C","text":"Visits are whole numbers, so the mean is rounded"},{"key":"D","text":"The frame leaves out members who enter another way"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The estimate is precise about app users only; if others visit more or less, it is biased whatever the size.","misconceptions":["Thinks 5,000 is too few: the standard error is already small","Confuses spread of the data with error of the estimate","Blames rounding, which affects the last digit only",""],"lo":["LO1"],"day":2,"session":1,"slide":{"deck":"week2","id":"check-frame","title":"Precise, but about what?"},"level":null,"pool":"checkpoint"},{"id":"review-week2-q1","type":"single","prompt":"A survey's sample grows from 200 to 800 people drawn from the same frame. What happens to the standard error of the mean and to the bias from the frame?","options":[{"key":"A","text":"Both are halved"},{"key":"B","text":"The standard error falls to a quarter; the bias is unchanged"},{"key":"C","text":"Neither changes"},{"key":"D","text":"The standard error is halved; the bias is unchanged"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"SE ∝ 1/√n, so four times n halves it; the frame bias does not depend on n.","misconceptions":["Thinks more data removes bias: the frame still misses the same people","Gets the factor wrong: four times n halves the standard error","Thinks the standard error depends only on the population",""],"lo":["LO1"],"day":3,"session":null,"slide":{"deck":"week3","id":"review-week2","title":"What shrinks when the sample grows?"},"level":null,"pool":"checkpoint"},{"id":"check-kind-q1","type":"single","prompt":"A depot tries a new route plan. Drivers who volunteered used it for a month; their deliveries were 6% faster than other drivers'. What kind of evidence is this, and what is its main weakness?","options":[{"key":"A","text":"Experimental; the month is too short"},{"key":"B","text":"Observational; volunteers may be faster drivers anyway"},{"key":"C","text":"Observational; too few deliveries were timed"},{"key":"D","text":"Experimental; the groups worked in the same month"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The drivers chose the plan, so anything that made them volunteer can also make them faster.","misconceptions":["Thinks a planned change is an experiment: here the drivers chose themselves","","Raises sample size, which affects precision, not who chose","Thinks comparing two groups at the same time makes it experimental"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"week3","id":"check-kind","title":"Observational or experimental?"},"level":null,"pool":"checkpoint"},{"id":"check-simpson-q1","type":"single","prompt":"Hospital H has a higher overall death rate than hospital K, but a lower rate both for routine and for emergency admissions. H takes most of the region's emergencies. Which hospital has the better record for a given kind of admission?","options":[{"key":"A","text":"K, because its overall rate is lower"},{"key":"B","text":"Neither: the figures contradict each other"},{"key":"C","text":"H, because it does better within each kind of admission"},{"key":"D","text":"Neither until both treat the same number of patients"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Admission type confounds the overall rate; within each type H does better.","misconceptions":["Reads the overall rate as like-for-like: it compares different mixes of patients","Thinks a reversal means the data are wrong: it means the mix differs","","Thinks equal sizes are needed to compare rates at all"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"week3","id":"check-simpson","title":"Which hospital would you choose?"},"level":null,"pool":"checkpoint"},{"id":"check-random-q1","type":"single","prompt":"Twenty schools are assigned a reading programme at random, ten each way. The programme schools happen to have slightly more pupils on average. What is the right reading?","options":[{"key":"A","text":"A chance imbalance: report it; the comparison is still fair on average"},{"key":"B","text":"The randomisation failed and must be redone"},{"key":"C","text":"Any difference in reading scores is caused by the programme"},{"key":"D","text":"The study is now observational"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Random assignment guarantees only that imbalances are due to chance; report them and test the outcome against chance.","misconceptions":["","Thinks any imbalance proves the draw was faulty","Thinks randomisation removes all variation, so any difference is the programme","Treats the experiment as observational"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"week3","id":"check-random","title":"What does randomisation buy?"},"level":null,"pool":"checkpoint"},{"id":"review-week3-q1","type":"single","prompt":"Branches that chose a new oven burn more trays overall, but fewer within both small and large branches. Large branches chose the oven more often and burn more trays with any oven. What is branch size here?","options":[{"key":"A","text":"The outcome of the comparison"},{"key":"B","text":"A source of random error that averages out"},{"key":"C","text":"The treatment"},{"key":"D","text":"A confounder: it drives both the choice and the burn rate"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Size affects who got the oven and how many trays burn, so the overall comparison mixes the two.","misconceptions":["Confuses a confounder with the outcome","Thinks size is just noise: it changes the direction of the comparison","Thinks it is the treatment being studied",""],"lo":["LO3"],"day":4,"session":null,"slide":{"deck":"week4","id":"review-week3","title":"Why does the overall rate mislead?"},"level":null,"pool":"checkpoint"},{"id":"check-resample-q1","type":"single","prompt":"A sample of six repair costs is 80, 95, 110, 120, 150, 400. Which of these can be a bootstrap resample of it?","options":[{"key":"A","text":"80, 95, 100, 120, 150, 400"},{"key":"B","text":"95, 110, 400"},{"key":"C","text":"400, 400, 80, 120, 120, 95"},{"key":"D","text":"The six values in a new order only"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Same size, values from the sample, repeats allowed.","misconceptions":["Thinks resamples are new draws from the population: they only reuse sample values","Thinks a resample is smaller than the sample: it keeps the same size","","Thinks a resample must use every value once: that is only the sample reordered"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"week4","id":"check-resample","title":"What can a resample contain?"},"level":null,"pool":"checkpoint"},{"id":"check-ci-q1","type":"single","prompt":"A report says: \"The 95% interval for the mean delivery time is 27 to 33 minutes, so 95% of deliveries take between 27 and 33 minutes.\" What is wrong?","options":[{"key":"A","text":"Nothing; it should just say 90%"},{"key":"B","text":"The interval should be centred exactly on 30"},{"key":"C","text":"Bootstrap intervals only describe medians"},{"key":"D","text":"It reads an interval for the mean as a range for single deliveries"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Single deliveries vary much more than their mean; the interval describes the mean.","misconceptions":["The level is fine: the problem is what the interval is about","Thinks intervals are always symmetric around the mean","Thinks bootstrap intervals cannot describe means",""],"lo":["LO2"],"day":4,"session":1,"slide":{"deck":"week4","id":"check-ci","title":"Classify the statement"},"level":null,"pool":"checkpoint"},{"id":"check-coverage-q1","type":"single","prompt":"A coverage study of a 95% interval method on a long-tailed population gives 0.86 at n = 12 and 0.94 at n = 150, from 1,000 samples each. What is the right conclusion?","options":[{"key":"A","text":"The method is close to its 95% at n = 150 and too narrow at n = 12"},{"key":"B","text":"The method fails at both sizes, since neither shows exactly 0.95"},{"key":"C","text":"Use more bootstrap resamples at n = 12 and it will reach 0.95"},{"key":"D","text":"The intervals at n = 150 are more often wrong because they are narrower"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"0.94 is within simulation error of 0.95; 0.86 is far below it.","misconceptions":["","Ignores the Monte Carlo error of about ±0.014 at 1,000 samples","Thinks more resamples would fix a small sample","Thinks coverage studies measure precision, not correctness"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"week4","id":"check-coverage","title":"What does this coverage study show?"},"level":null,"pool":"checkpoint"},{"id":"review-week4-q1","type":"single","prompt":"An analyst builds a 95% percentile bootstrap interval for the median waiting time from one sample. Which statement about it is correct?","options":[{"key":"A","text":"95% of waits fall inside it"},{"key":"B","text":"Its method contains the true median in about 95% of samples, if the method's coverage is right"},{"key":"C","text":"The true median has a 95% chance of being inside this interval"},{"key":"D","text":"95% of the bootstrap resamples contain the true median"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The level describes how often the method works, and only as far as its coverage holds at this n.","misconceptions":["Reads an interval for a median as a range for single waits","","Puts the probability on the fixed true median","Confuses the interval with the bootstrap resamples"],"lo":["LO2"],"day":5,"session":null,"slide":{"deck":"week5","id":"review-week4","title":"What does the 95% describe?"},"level":null,"pool":"checkpoint"},{"id":"check-suppress-q1","type":"single","prompt":"A table of mean monthly spending by district and age band has one cell of 11 customers whose mean is unusually high. What do you publish for that cell?","options":[{"key":"A","text":"The mean, flagged as based on few customers"},{"key":"B","text":"The cell merged into its largest neighbour, without saying so"},{"key":"C","text":"\"Suppressed\", with the count shown only as under 30"},{"key":"D","text":"The median of the 11 instead of their mean"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The rule removes both the value and the exact size of a small group.","misconceptions":["A warning flag still publishes the value of a group of eleven","Merging changes the group after seeing its value, and is a choice to report, not a default","","The median of eleven is just as revealing"],"lo":["LO4"],"day":5,"session":1,"slide":{"deck":"week5","id":"check-suppress","title":"What leaves the notebook?"},"level":null,"pool":"checkpoint"},{"id":"check-difference-q1","type":"single","prompt":"You want a bootstrap interval for the difference in median call length between two support teams (220 and 90 calls). Which resampling scheme fits?","options":[{"key":"A","text":"220 calls with replacement from team one, 90 from team two"},{"key":"B","text":"310 calls from the pooled calls, split 220 and 90"},{"key":"C","text":"90 calls from each team"},{"key":"D","text":"220 and 90 calls without replacement"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Each team is resampled at its own size, with replacement, as it was collected.","misconceptions":["","Pooling resamples the null of no difference","Changing the sizes changes the spread of each median","Without replacement each resample is the original team reordered"],"lo":["LO4"],"day":5,"session":1,"slide":{"deck":"week5","id":"check-difference","title":"How do you resample?"},"level":null,"pool":"checkpoint"},{"id":"check-slope-q1","type":"single","prompt":"You fit the slope of energy use on floor area for 140 buildings and want a bootstrap interval for it. Which draws one resample?","options":[{"key":"A","text":"140 areas and, separately, 140 energy values, both with replacement"},{"key":"B","text":"The 140 energy values shuffled against fixed areas"},{"key":"C","text":"70 buildings drawn without replacement"},{"key":"D","text":"140 buildings drawn with replacement, each with its own area and energy"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Rows are the units; resampling them keeps each pair together.","misconceptions":["Breaks the pairs, which destroys the relation","That builds the null of no relation: a permutation test","Uses only part of the data, which widens the interval for no reason",""],"lo":["LO4"],"day":5,"session":1,"slide":{"deck":"week5","id":"check-slope","title":"Which resampling for a slope?"},"level":null,"pool":"checkpoint"},{"id":"review-week5-q1","type":"single","prompt":"Two warehouses' mean picking times have 95% intervals 11.0 to 13.0 and 12.5 to 14.5 minutes. A manager concludes there is no difference because the intervals overlap. What should the analyst do?","options":[{"key":"A","text":"Agree: overlapping intervals mean no difference"},{"key":"B","text":"Recompute both intervals at 99% to remove the overlap"},{"key":"C","text":"Build a bootstrap interval for the difference itself"},{"key":"D","text":"Pool both warehouses and build one interval"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The question is about the difference: estimate it, with its own interval.","misconceptions":["Accepts the overlap rule, which does not settle a difference","Thinks a wider level makes overlap less likely: it does the opposite","","Pooling the warehouses removes the very difference in question"],"lo":["LO2","LO4"],"day":6,"session":null,"slide":{"deck":"week6","id":"review-week5","title":"Which interval answers the question?"},"level":null,"pool":"checkpoint"},{"id":"check-null-q1","type":"single","prompt":"Thirty stores were randomly given a new price label; thirty kept the old one. To test whether weekly sales differ, what does each permutation do?","options":[{"key":"A","text":"Resample each group with replacement"},{"key":"B","text":"Shuffle the 60 stores' labels and split them 30 and 30"},{"key":"C","text":"Sort the sales and give the top 30 the new label"},{"key":"D","text":"Add random noise to each store's sales"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Under no effect the labels are exchangeable; shuffling them keeps the group sizes and the data.","misconceptions":["That is a bootstrap, which estimates rather than builds the null","","Sorting creates the largest possible difference, not the null","Changes the data instead of the labels"],"lo":["LO5"],"day":6,"session":1,"slide":{"deck":"week6","id":"check-null","title":"What do you shuffle?"},"level":null,"pool":"checkpoint"},{"id":"check-pvalue-q1","type":"single","prompt":"A report says: \"p = 0.01, so there is only a 1% chance that the new schedule has no effect.\" Which correction is right?","options":[{"key":"A","text":"\"There is a 99% chance the schedule works.\""},{"key":"B","text":"\"The schedule improves the outcome by 1%.\""},{"key":"C","text":"\"If the schedule had no effect, a difference at least this large would arise in about 1% of relabellings.\""},{"key":"D","text":"\"The result is significant at the 5% level, so the effect is certain.\""}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A p-value is computed assuming no effect; it cannot be the probability of that assumption.","misconceptions":["Swaps one reversal for another","Turns the p-value into an effect size","","Changes the threshold instead of the reading"],"lo":["LO2"],"day":6,"session":1,"slide":{"deck":"week6","id":"check-pvalue","title":"Correct the sentence"},"level":null,"pool":"checkpoint"},{"id":"check-report-q1","type":"single","prompt":"A permutation test of two packing methods on 400 boxes gives p = 0.004. Which report follows the course's standard?","options":[{"key":"A","text":"\"Method B is significantly better (p \u003c 0.05).\""},{"key":"B","text":"\"p = 0.004 proves method B is better.\""},{"key":"C","text":"\"Method B is better with 99.6% probability.\""},{"key":"D","text":"\"B damaged 1.2 fewer boxes per hundred (interval 0.4 to 2.0); shuffles rarely gave a gap this large (p = 0.004).\""}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Size in the outcome's units, its interval, then the p-value read correctly.","misconceptions":["A bare verdict hides size, direction and uncertainty","Claims proof, which no test gives","Turns p into a probability of the hypothesis",""],"lo":["LO5"],"day":6,"session":1,"slide":{"deck":"week6","id":"check-report","title":"Which report meets the standard?"},"level":null,"pool":"checkpoint"},{"id":"review-week6-q1","type":"single","prompt":"A permutation test of a new checkout layout gives p = 0.21 on 40 shops. A manager writes: \"the layout has no effect\". What is the best correction?","options":[{"key":"A","text":"\"The data cannot tell at this size; the interval for the effect is wide.\""},{"key":"B","text":"\"There is a 79% chance the layout works.\""},{"key":"C","text":"\"The layout makes things worse.\""},{"key":"D","text":"\"Retest at α = 0.01 to confirm there is no effect.\""}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Not enough evidence of an effect is not evidence of no effect; the interval shows how much is still possible.","misconceptions":["","Reads p as the probability that the layout works","Reads a non-significant p as proof in the other direction","Thinks a smaller α fixes the reading"],"lo":["LO2"],"day":7,"session":null,"slide":{"deck":"week7","id":"review-week6","title":"Read the result"},"level":null,"pool":"checkpoint"},{"id":"check-many-q1","type":"single","prompt":"A regional report tests 40 districts for a change in complaints after a policy, each at α = 0.05. Two districts show a \"significant\" change. Assume the policy did nothing. How many would you expect?","options":[{"key":"A","text":"None, since α is only 5%"},{"key":"B","text":"About 0.05"},{"key":"C","text":"About 2"},{"key":"D","text":"About 32"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"40 × 0.05 = 2 false findings are expected with no effect at all.","misconceptions":["Thinks α applies to the report as a whole, not to each test","Takes the rate α for the count: 0.05 is the share per test, not the number of findings","","Confuses α with power"],"lo":["LO6"],"day":7,"session":1,"slide":{"deck":"week7","id":"check-many","title":"How surprising is this?"},"level":null,"pool":"checkpoint"},{"id":"check-correction-q1","type":"single","prompt":"A team screens 300 product ideas from survey data to pick some for a costly follow-up trial; a few false picks are acceptable if most picks are real. Which control fits?","options":[{"key":"A","text":"No correction: each test is at 5%"},{"key":"B","text":"Benjamini-Hochberg, controlling the share of false picks"},{"key":"C","text":"Bonferroni, controlling any false pick at all"},{"key":"D","text":"Test each idea at α = 0.01 instead"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Screening for follow-up tolerates a small share of false picks; that is what the false discovery rate controls.","misconceptions":["No correction lets about 15 false picks through on noise alone","","Fits a few decisive claims; with 300 tests it would rarely pick anything","A stricter single α does not account for the number of tests"],"lo":["LO6"],"day":7,"session":1,"slide":{"deck":"week7","id":"check-correction","title":"Which procedure fits the purpose?"},"level":null,"pool":"checkpoint"},{"id":"check-forking-q1","type":"single","prompt":"A summary reports that a staff-training course \"significantly reduced errors among evening-shift staff over 40 (p = 0.03)\". The full data covered all shifts and ages; no subgroup was planned. What is the main problem?","options":[{"key":"A","text":"Evening staff may be less careful"},{"key":"B","text":"None: p = 0.03 is below 0.05"},{"key":"C","text":"The subgroup is too small for a permutation test"},{"key":"D","text":"A forking path: the subgroup was picked after seeing the data"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Many subgroups could have been reported; choosing the one that passed makes p = 0.03 far less surprising than it looks.","misconceptions":["Raises a real but secondary concern; the main issue is how the subgroup was chosen","Thinks a small p-value rules out chance whatever the route to it","Thinks sample size is the issue: the issue is the choice",""],"lo":["LO3"],"day":7,"session":1,"slide":{"deck":"week7","id":"check-forking","title":"Name the problem"},"level":null,"pool":"checkpoint"},{"id":"review-week7-q1","type":"single","prompt":"A safety report makes five claims, each of which would trigger a costly recall. The analyst wants a low chance of even one false claim. Which procedure fits?","options":[{"key":"A","text":"Benjamini-Hochberg"},{"key":"B","text":"No correction, α = 0.05 each"},{"key":"C","text":"Holm, which controls the family-wise error rate"},{"key":"D","text":"Report only the claim with the smallest p-value"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Each false claim is costly, so control the chance of any: Holm does, with more power than Bonferroni.","misconceptions":["Controls the share of false claims, not the chance of any","Leaves about a 23% chance of at least one false claim with five true nulls","","One test per claim is still five tests"],"lo":["LO6"],"day":8,"session":null,"slide":{"deck":"week8","id":"review-week7","title":"Which correction, and what does it promise?"},"level":null,"pool":"checkpoint"},{"id":"check-power-q1","type":"single","prompt":"A pilot with 10 customers per group finds no significant effect of a new menu on spending. A simulation says the test had 18% power for the effect that would matter. What should the report say?","options":[{"key":"A","text":"The new menu does not change spending"},{"key":"B","text":"The false-finding rate was 82%"},{"key":"C","text":"The new menu reduces spending"},{"key":"D","text":"The pilot was too small to tell; it would miss that effect about four times in five"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"With 18% power a real effect usually goes undetected; report the wide interval, not \"no effect\".","misconceptions":["Reads a weak test's silence as evidence of absence","Confuses power with the Type I error rate","Invents a direction the test did not show",""],"lo":["LO5"],"day":8,"session":1,"slide":{"deck":"week8","id":"check-power","title":"What does the null result say?"},"level":null,"pool":"checkpoint"},{"id":"check-practical-q1","type":"single","prompt":"A new delivery route must save at least 3 minutes a trip to justify the change. A trial gives a saving of 1.1 minutes, 95% interval 0.6 to 1.6, p \u003c 0.001. What is the decision?","options":[{"key":"A","text":"Adopt it: the saving is highly significant"},{"key":"B","text":"Do not adopt it: even the top of the interval is below 3 minutes"},{"key":"C","text":"Unclear: run a larger trial"},{"key":"D","text":"Adopt it: p below 0.001 means a large saving"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The effect is real and too small to matter: the interval sits below the threshold.","misconceptions":["Confuses statistical with practical significance","","The interval is narrow and wholly below the threshold: nothing is unclear","Thinks a small p-value means a large saving"],"lo":["LO5"],"day":8,"session":1,"slide":{"deck":"week8","id":"check-practical","title":"Decide"},"level":null,"pool":"checkpoint"},{"id":"check-report-q1","type":"single","prompt":"A note says: \"Result: the new rota cut overtime by 6 hours a month (interval 2 to 10). Checked by: an assistant wrote the code. Limits: one region. Reviewer: the team lead.\" What is the weakest part?","options":[{"key":"A","text":"\"Checked by\": it says who wrote the code, not how the result was verified"},{"key":"B","text":"\"Result\": it should give the p-value instead of the interval"},{"key":"C","text":"\"Limits\": a limit should never be stated in a report"},{"key":"D","text":"\"Reviewer\": the analyst should review their own work"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A check is something run: a hand case, a second method, a rerun. An assistant writing the code is not a check.","misconceptions":["","The result gives size and interval as it should","Naming the scope is exactly what the limits line is for","A second person rerunning it is the point of the reviewer line"],"lo":["LO3"],"day":8,"session":1,"slide":{"deck":"week8","id":"check-report","title":"What is missing from this note?"},"level":null,"pool":"checkpoint"},{"id":"w1-typical-fee","type":"single","prompt":"A clinic's 400 appointment fees have a long right tail. The manager asks for \"the fee a typical patient pays\". Which summary answers that request?","options":[{"key":"A","text":"The median fee"},{"key":"B","text":"The standard deviation of the fees"},{"key":"C","text":"The largest fee"},{"key":"D","text":"The mean fee"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The median is the middle fee: half pay less, half pay more, whatever the size of the tail.","misconceptions":["","Confuses spread with level: the standard deviation is not a fee anyone pays","Reads \"typical\" as \"most extreme\"","Uses the summary for totals: the tail pulls the mean above what most patients pay"],"lo":["LO4"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w1-missing-direction","type":"single","prompt":"A survey of training satisfaction gets answers from 60% of participants. Staff say those who disliked the course rarely answer. The average score of the answers is 4.3 of 5. What is the most likely relation to the average over all participants?","options":[{"key":"A","text":"The all-participant average is higher than 4.3"},{"key":"B","text":"It is about 4.3, since 60% is a large share"},{"key":"C","text":"The all-participant average is lower than 4.3"},{"key":"D","text":"It cannot differ, because an average uses every answer"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The missing answers are the low ones, so the answers received overstate satisfaction.","misconceptions":["Gets the direction backwards: the missing scores are the low ones","Assumes non-response is random: here it is linked to the score itself","","Thinks the average covers people who did not answer"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"w1-fence-tf","type":"tf","prompt":"A value above Q3 + 1.5 × IQR should be deleted before any summary is computed.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The fence flags values to inspect; in a long right tail many values above it are real. Delete only proven errors.","misconceptions":["Treats a screening rule as proof of an error",""],"lo":["LO4"],"day":1,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"w2-se-meaning","type":"single","prompt":"From one sample of 100 delivery times an analyst reports a mean of 31 minutes with a standard error of 1.2 minutes. What does the 1.2 describe?","options":[{"key":"A","text":"The share of deliveries that took longer than 31 minutes"},{"key":"B","text":"The error in the clock used to time the deliveries"},{"key":"C","text":"How far a single delivery typically is from 31 minutes"},{"key":"D","text":"How far the sample mean typically lands from the population mean, sample to sample"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A standard error is the spread of a statistic over repeated samples, not the spread of the individual values.","misconceptions":["Reads a standard error as a proportion","Thinks \"error\" means a measuring mistake","Confuses the standard error with the standard deviation of the values",""],"lo":["LO1"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"w2-quadruple-n","type":"numeric","prompt":"A sample mean has a standard error of 3.0 with n = 50. Roughly what standard error do you expect with n = 200 from the same population?","options":[],"correct":[],"answer":1.5,"tolerance":0.1,"unit":"","explanation":"The standard error falls like 1/√n: four times the sample size halves it, 3.0 / 2 = 1.5.","misconceptions":[],"lo":["LO1"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w2-frame","type":"single","prompt":"A city surveys residents about bus services by calling the landline numbers in an old directory. It plans to triple the sample size to make the estimate more accurate. What does tripling change?","options":[{"key":"A","text":"It changes nothing, since the standard error does not depend on n"},{"key":"B","text":"It shrinks the standard error but leaves the frame bias as it was"},{"key":"C","text":"It doubles the bias, since more landline owners are reached"},{"key":"D","text":"It removes the bias, since a larger sample represents everyone"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A larger sample is more precise about the people the frame reaches; the frame still misses those without a landline.","misconceptions":["Forgets that the standard error falls with n","","Thinks bias grows with n: it stays the same","Thinks size cures bias"],"lo":["LO1"],"day":2,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"w2-parameter-statistic","type":"single","prompt":"An inspector weighs 40 loaves from a day's production of 5,000 and finds a mean of 402 g. Which is the parameter?","options":[{"key":"A","text":"The 402 g mean of the 40 loaves"},{"key":"B","text":"The number of loaves weighed"},{"key":"C","text":"The mean weight of all 5,000 loaves"},{"key":"D","text":"The spread of the 40 weights"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A parameter describes the population (all 5,000 loaves); the 402 g is a statistic computed from the sample.","misconceptions":["Calls a sample result a parameter","Confuses the sample size with a quantity being estimated","","Names a sample statistic, not a population quantity"],"lo":["LO1"],"day":2,"session":1,"slide":null,"level":"remember","pool":"practice"},{"id":"w3-simpson","type":"single","prompt":"Clinic A has a higher overall complication rate than clinic B, yet a lower rate within both mild and severe cases. What best explains this?","options":[{"key":"A","text":"Clinic A treats a much larger share of severe cases"},{"key":"B","text":"Clinic B records complications more carefully"},{"key":"C","text":"Clinic A treats fewer patients in total"},{"key":"D","text":"A arithmetic error: rates within groups must agree with the overall rate"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Case severity confounds the comparison: A's overall rate is weighted towards severe cases, which have more complications everywhere.","misconceptions":["","Explains with a measurement story that would not reverse within groups","Total numbers alone do not reverse a comparison; the mix does","Does not know that a reversal is possible: weights differ between groups"],"lo":["LO3"],"day":3,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"w3-randomise-tf","type":"tf","prompt":"Randomly assigning a treatment means that any difference between the groups in other characteristics is due to chance.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Randomisation does not make groups identical, but it makes every imbalance, recorded or not, a matter of chance.","misconceptions":["","Thinks randomisation must balance every characteristic exactly to be useful"],"lo":["LO3"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"w3-confounder","type":"single","prompt":"Stores that adopted a new scheduling tool sell more per hour than stores that did not. Managers chose whether to adopt it, and larger, busier stores adopted it first. What is the main problem with reading the difference as the tool's effect?","options":[{"key":"A","text":"The difference may be too small to matter"},{"key":"B","text":"Sales per hour is a skewed measure"},{"key":"C","text":"The tool may not have been used every day"},{"key":"D","text":"Store size affects both adoption and sales per hour"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Store size is a confounder: it drove adoption and also raises sales per hour, so the comparison mixes the two.","misconceptions":["Raises practical significance, a different question","Skewness affects the summary, not the confounding","Raises compliance, which does not explain the bias",""],"lo":["LO3"],"day":3,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"w4-ci-meaning","type":"single","prompt":"A 95% bootstrap interval for the mean basket value is 19.1 to 25.3 riyals. Which reading is correct?","options":[{"key":"A","text":"95% of baskets are worth between 19.1 and 25.3 riyals"},{"key":"B","text":"The method gives intervals that contain the population mean in about 95% of samples"},{"key":"C","text":"There is a 95% chance that a new basket falls in the interval"},{"key":"D","text":"The sample mean is 95% likely to lie between 19.1 and 25.3"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The 95% describes the method over repeated samples; the interval is about the population mean, not about single baskets.","misconceptions":["Reads an interval for a mean as a range for individual values","","Treats a confidence interval as a prediction interval","The sample mean is known exactly and always lies inside"],"lo":["LO2"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"w4-coverage-small","type":"single","prompt":"A coverage study draws 1,000 samples of 8 values from a long-tailed population and finds that the 95% percentile bootstrap interval for the mean covers the truth 84% of the time. What is the main reason?","options":[{"key":"A","text":"Small samples rarely contain the tail, so resamples understate the variation"},{"key":"B","text":"The percentile method is only valid for medians"},{"key":"C","text":"Coverage studies always underestimate coverage"},{"key":"D","text":"Too few bootstrap resamples were used"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"With eight values the sample seldom shows the rare large ones, so the bootstrap distribution is too narrow.","misconceptions":["","Invents a restriction: the percentile method is used for means too","Blames the check rather than the method","More resamples reduce resampling noise but cannot add what the sample lacks"],"lo":["LO4"],"day":4,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"w4-resample-tf","type":"tf","prompt":"A bootstrap resample draws the same number of values as the original sample, without replacement.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"It draws with replacement; without replacement every resample would be the original sample reordered.","misconceptions":["Confuses the bootstrap with drawing samples from a population",""],"lo":["LO4"],"day":4,"session":1,"slide":null,"level":"remember","pool":"practice"},{"id":"w4-seed-move","type":"single","prompt":"Rerunning a bootstrap notebook with a new seed moves the ends of a 95% interval from (12.40, 18.90) to (12.37, 18.95). What should the analyst conclude?","options":[{"key":"A","text":"The data must have changed between runs"},{"key":"B","text":"The result is unreliable and should not be reported"},{"key":"C","text":"This is resampling noise; report the interval to one decimal and state the resamples used"},{"key":"D","text":"The seed should be chosen to give the narrowest interval"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Moves of a few hundredths against a width of 6.5 are resampling noise; reporting precision and the number of resamples settle it.","misconceptions":["Same data, different seed: a small move is expected","Mistakes small resampling noise for instability","","Choosing a seed by its result is a forking path"],"lo":["LO4"],"day":4,"session":1,"slide":null,"level":"evaluate","pool":"practice"},{"id":"w5-diff-resample","type":"single","prompt":"To build a bootstrap interval for the difference in mean repair cost between two depots (60 and 45 jobs), how should each resample be drawn?","options":[{"key":"A","text":"Draw 45 from each depot so the groups are equal"},{"key":"B","text":"Draw 60 from the first depot without replacement"},{"key":"C","text":"Pool the 105 jobs and draw 105 with replacement"},{"key":"D","text":"Draw 60 with replacement from the first depot and 45 from the second"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Resampling each group separately at its own size copies how the data were collected.","misconceptions":["Changes the sample sizes, so the spread is wrong","Without replacement every resample is the original group","Pooling resamples the null of no difference, not the estimate",""],"lo":["LO4"],"day":5,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w5-slope-pairs","type":"single","prompt":"For a bootstrap interval of the slope of fuel use on distance, what is resampled?","options":[{"key":"A","text":"Distances and fuel values separately"},{"key":"B","text":"Whole trips: each distance with its own fuel value"},{"key":"C","text":"Only the fuel values, keeping distances fixed in order"},{"key":"D","text":"Only the residuals of a fit to the shuffled data"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The slope is a relation between pairs, so resampling whole rows keeps each pair together.","misconceptions":["Breaks the pairs and destroys the relation the slope measures","","Keeps x fixed and shuffles y: that is a permutation test of no relation","Mixes a residual bootstrap with shuffling, which tests rather than estimates"],"lo":["LO4"],"day":5,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w5-suppress","type":"single","prompt":"A public table of mean hospital stays by region and age band has one cell with 7 patients. The course's rule suppresses groups under 30 rows. What do you publish for that cell?","options":[{"key":"A","text":"The median instead of the mean"},{"key":"B","text":"The mean and the count, marked as unreliable"},{"key":"C","text":"The cell marked as suppressed, with the count shown only as under 30"},{"key":"D","text":"The mean rounded to the nearest whole day"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Suppression removes both the value and the exact count of a small group, which could otherwise identify people.","misconceptions":["Changing the summary does not change the size of the group","A warning does not protect a group of seven","","Rounding still reveals the small group's value"],"lo":["LO4"],"day":5,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w6-pvalue-meaning","type":"single","prompt":"A permutation test of a new layout against the old one gives p = 0.03. Which statement is correct?","options":[{"key":"A","text":"If the layout had no effect, a difference at least this large would appear in about 3% of shuffles"},{"key":"B","text":"The new layout improves sales by 3%"},{"key":"C","text":"97% of customers prefer the new layout"},{"key":"D","text":"There is a 3% chance that the new layout has no effect"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A p-value is computed assuming no effect: it is the share of relabellings at least as extreme as the data.","misconceptions":["","Reads p as an effect size","Reads p as a share of people","Reverses the conditional: p is not the probability that the null is true"],"lo":["LO2"],"day":6,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"w6-big-n-tf","type":"tf","prompt":"With 50,000 rows a permutation test can give a very small p-value for a difference too small to matter.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Large samples detect small differences; whether a difference matters is read from the effect size and its interval.","misconceptions":["","Thinks a small p-value implies a large effect"],"lo":["LO5"],"day":6,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"w6-shuffle","type":"single","prompt":"To test whether training hours and test scores are associated in 120 employees, what does each permutation do?","options":[{"key":"A","text":"Sort both columns and pair them in order"},{"key":"B","text":"Drop a random employee and recompute"},{"key":"C","text":"Resample employees with replacement"},{"key":"D","text":"Shuffle the scores against the hours, keeping both columns"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Under no association any pairing of scores with hours is as likely, so shuffling one column against the other builds the null.","misconceptions":["Sorting creates the strongest possible association, not the null","Leaving one out estimates sensitivity, not the null","That is the bootstrap: it estimates, it does not build the null",""],"lo":["LO5"],"day":6,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w6-report","type":"single","prompt":"Which report of a permutation test follows the course's standard?","options":[{"key":"A","text":"\"Significant (p \u003c 0.05).\""},{"key":"B","text":"\"Visits were 0.8 higher (95% interval 0.5 to 1.1); shuffling the labels rarely gave a gap this large (p = 0.002).\""},{"key":"C","text":"\"p = 0.002, which proves the plan works.\""},{"key":"D","text":"\"The null hypothesis is 99.8% false.\""}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An effect size with its interval, the p-value and a plain reading; no claim of proof.","misconceptions":["A bare p-value hides the size and direction","","A p-value never proves a causal claim","Converts p into a probability that the null is false"],"lo":["LO5"],"day":6,"session":1,"slide":null,"level":"evaluate","pool":"practice"},{"id":"w7-familywise","type":"numeric","prompt":"A report tests 10 independent outcomes with no true effect, each at α = 0.05. To two decimals, how likely is at least one false finding?","options":[],"correct":[],"answer":0.4,"tolerance":0.01,"unit":"","explanation":"1 − 0.95¹⁰ = 0.40.","misconceptions":[],"lo":["LO6"],"day":7,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w7-holm-bh","type":"single","prompt":"Six p-values: 0.001, 0.006, 0.012, 0.019, 0.044, 0.31, with α = 0.05. How many does Benjamini-Hochberg reject?","options":[{"key":"A","text":"2"},{"key":"B","text":"3"},{"key":"C","text":"4"},{"key":"D","text":"5"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Thresholds k × 0.05 / 6: 0.019 ≤ 0.033 for k = 4, but 0.044 > 0.042 for k = 5, so four are rejected.","misconceptions":["Applies Bonferroni's threshold of 0.0083","Stops at Holm's answer","","Rejects every p below 0.05, which is no correction"],"lo":["LO6"],"day":7,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w7-forking","type":"single","prompt":"An analyst ran one test, but chose the subgroup, the outcome and the outlier rule after seeing the data. Why is the p-value of that one test misleading?","options":[{"key":"A","text":"Because the choices that could have been made act like extra tests"},{"key":"B","text":"Because outliers should never be removed"},{"key":"C","text":"Because subgroups are always too small"},{"key":"D","text":"Because a single test has no p-value"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Data-dependent choices open many forking paths; picking one after seeing the data inflates the false-finding rate even with one test run.","misconceptions":["","Outlier rules are fine when fixed in advance","Subgroup size is a different issue","A single test has a p-value; its meaning is the problem"],"lo":["LO3"],"day":7,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"w7-correction-tf","type":"tf","prompt":"When every tested outcome has no true effect, a false-discovery-rate correction and a family-wise correction control the same error.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"With only true nulls every finding is false, so \"at least one false finding\" and \"a nonzero share of false findings\" happen together.","misconceptions":["","Thinks the two always differ: they part only when some effects are real"],"lo":["LO6"],"day":7,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"w8-power","type":"single","prompt":"A trial with 15 shops per arm finds \"no significant difference\" in sales. A simulation shows the test had 20% power for the effect that matters. What should the report say?","options":[{"key":"A","text":"The Type I error rate was 80%"},{"key":"B","text":"The intervention has no effect"},{"key":"C","text":"The trial could not tell: it would miss an effect that matters four times in five"},{"key":"D","text":"The intervention made sales worse"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Low power means a non-significant result is weak evidence of no effect; report the interval.","misconceptions":["Confuses Type II with Type I error","Reads absence of evidence as evidence of absence","","Invents a direction the test did not show"],"lo":["LO5"],"day":8,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"w8-false-share","type":"single","prompt":"A team tests 100 ideas a year; 10 truly work. Tests use α = 0.05 and have power 0.5. About what share of \"significant\" results are false?","options":[{"key":"A","text":"About 5%"},{"key":"B","text":"About 10%"},{"key":"C","text":"About 47%"},{"key":"D","text":"About 95%"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"False findings 90 × 0.05 = 4.5; true findings 10 × 0.5 = 5; 4.5 / 9.5 is about 47%.","misconceptions":["Reads α as the share of findings that are false","Confuses the share of real ideas with the false share","","Takes 1 − α as the false share"],"lo":["LO2"],"day":8,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"w8-type1-n","type":"single","prompt":"As the sample size of a well-built test grows, what happens to its Type I error rate and its power for a fixed real effect?","options":[{"key":"A","text":"The Type I error rate rises; power stays the same"},{"key":"B","text":"Both rise"},{"key":"C","text":"Both fall"},{"key":"D","text":"The Type I error rate stays near α; power rises"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The test is built to reject a true null at rate α at any size; more data buys power.","misconceptions":["Gets both relations wrong","Thinks false alarms grow with n","Thinks more data lowers false alarms below α",""],"lo":["LO6"],"day":8,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"w8-practical","type":"single","prompt":"An offer must lift basket value by at least 2 riyals to pay for itself. A trial gives +2.6 riyals (95% interval 0.4 to 4.8), p = 0.02. What is the right decision statement?","options":[{"key":"A","text":"Not worth it: the interval includes values below 2"},{"key":"B","text":"Unclear: the interval contains values both below and above 2"},{"key":"C","text":"Worth it: the estimate is above 2"},{"key":"D","text":"Worth it: the result is significant"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Practical significance compares the interval with the threshold: here it straddles 2.","misconceptions":["Ignores the values above 2 in the interval","","Ignores the uncertainty around the estimate","Confuses statistical with practical significance"],"lo":["LO5"],"day":8,"session":1,"slide":null,"level":"evaluate","pool":"practice"}]}</script>
