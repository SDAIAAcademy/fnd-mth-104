<section>
<h2>Week 1: Describing data</h2>
<ol>
<li><p>The finance analyst must forecast next month's total delivery charges from this month's 2,000 deliveries, whose charges have a long right tail. Which summary of this month's charges does the forecast need?</p><ul><li><b>A.</b> The median charge</li><li><b>B.</b> The 20% trimmed mean charge</li><li><b>C.</b> The mean charge</li><li><b>D.</b> The interquartile range of the charges</li></ul></li>
<li><p>A month of 3,000 coffee orders has a high fence of 31 riyals. Forty orders lie above it, the largest 96 riyals for 14 drinks at a branch next to an office block. What do you do?</p><ul><li><b>A.</b> Keep it: value per drink is ordinary, so it is a real large order</li><li><b>B.</b> Delete all forty orders above the fence</li><li><b>C.</b> Replace it with the fence value, 31</li><li><b>D.</b> Delete it, because it will distort the median</li></ul></li>
<li><p>A delivery service logs delivery times by hand. Drivers often skip the log when they are running late. The median of the logged times is 28 minutes. What is the most likely relation to the true median?</p><ul><li><b>A.</b> About the same, since a median ignores missing rows</li><li><b>B.</b> The true median is lower than 28 minutes</li><li><b>C.</b> Impossible to say, because medians are robust</li><li><b>D.</b> The true median is higher than 28 minutes</li></ul></li>
<li><p>A clinic's 400 appointment fees have a long right tail. The manager asks for "the fee a typical patient pays". Which summary answers that request?</p><ul><li><b>A.</b> The median fee</li><li><b>B.</b> The standard deviation of the fees</li><li><b>C.</b> The largest fee</li><li><b>D.</b> The mean fee</li></ul></li>
<li><p>A survey of training satisfaction gets answers from 60% of participants. Staff say those who disliked the course rarely answer. The average score of the answers is 4.3 of 5. What is the most likely relation to the average over all participants?</p><ul><li><b>A.</b> The all-participant average is higher than 4.3</li><li><b>B.</b> It is about 4.3, since 60% is a large share</li><li><b>C.</b> The all-participant average is lower than 4.3</li><li><b>D.</b> It cannot differ, because an average uses every answer</li></ul></li>
<li><p>A value above Q3 + 1.5 × IQR should be deleted before any summary is computed.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Week 2: Sampling variation</h2>
<ol>
<li><p>Eleven parcel weights have a median of 2.4 kg. Which single change can move the median?</p><ul><li><b>A.</b> Doubling the heaviest parcel</li><li><b>B.</b> Halving the lightest parcel</li><li><b>C.</b> Adding two more parcels, both heavier than 2.4 kg</li><li><b>D.</b> Rounding every weight to one decimal</li></ul></li>
<li><p>An auditor checks 80 of a branch's 1,200 invoices for the month and finds 6 with errors. Which of these is a statistic?</p><ul><li><b>A.</b> The share of errors among the 80 checked, 7.5%</li><li><b>B.</b> The 1,200 invoices of the month</li><li><b>C.</b> The share of errors among all 1,200 invoices</li><li><b>D.</b> The number of invoices checked, 80</li></ul></li>
<li><p>Weighing 25 croissants gives a standard error of 2 g for the mean weight. The quality lead wants a standard error of 1 g. About how many croissants must she weigh?</p><ul><li><b>A.</b> 50</li><li><b>B.</b> 100</li><li><b>C.</b> 400</li><li><b>D.</b> 25, but weighed more carefully</li></ul></li>
<li><p>A gym estimates members' weekly visits from 5,000 check-ins logged by its entrance machine, which records only members who use the app to enter. What is the main weakness?</p><ul><li><b>A.</b> The sample is too small for a stable mean</li><li><b>B.</b> Visit counts have a large standard deviation</li><li><b>C.</b> Visits are whole numbers, so the mean is rounded</li><li><b>D.</b> The frame leaves out members who enter another way</li></ul></li>
<li><p>From one sample of 100 delivery times an analyst reports a mean of 31 minutes with a standard error of 1.2 minutes. What does the 1.2 describe?</p><ul><li><b>A.</b> The share of deliveries that took longer than 31 minutes</li><li><b>B.</b> The error in the clock used to time the deliveries</li><li><b>C.</b> How far a single delivery typically is from 31 minutes</li><li><b>D.</b> How far the sample mean typically lands from the population mean, sample to sample</li></ul></li>
<li><p>A sample mean has a standard error of 3.0 with n = 50. Roughly what standard error do you expect with n = 200 from the same population?</p></li>
<li><p>A city surveys residents about bus services by calling the landline numbers in an old directory. It plans to triple the sample size to make the estimate more accurate. What does tripling change?</p><ul><li><b>A.</b> It changes nothing, since the standard error does not depend on n</li><li><b>B.</b> It shrinks the standard error but leaves the frame bias as it was</li><li><b>C.</b> It doubles the bias, since more landline owners are reached</li><li><b>D.</b> It removes the bias, since a larger sample represents everyone</li></ul></li>
<li><p>An inspector weighs 40 loaves from a day's production of 5,000 and finds a mean of 402 g. Which is the parameter?</p><ul><li><b>A.</b> The 402 g mean of the 40 loaves</li><li><b>B.</b> The number of loaves weighed</li><li><b>C.</b> The mean weight of all 5,000 loaves</li><li><b>D.</b> The spread of the 40 weights</li></ul></li>
</ol>
</section>
<section>
<h2>Week 3: Observational and experimental data</h2>
<ol>
<li><p>A survey's sample grows from 200 to 800 people drawn from the same frame. What happens to the standard error of the mean and to the bias from the frame?</p><ul><li><b>A.</b> Both are halved</li><li><b>B.</b> The standard error falls to a quarter; the bias is unchanged</li><li><b>C.</b> Neither changes</li><li><b>D.</b> The standard error is halved; the bias is unchanged</li></ul></li>
<li><p>A depot tries a new route plan. Drivers who volunteered used it for a month; their deliveries were 6% faster than other drivers'. What kind of evidence is this, and what is its main weakness?</p><ul><li><b>A.</b> Experimental; the month is too short</li><li><b>B.</b> Observational; volunteers may be faster drivers anyway</li><li><b>C.</b> Observational; too few deliveries were timed</li><li><b>D.</b> Experimental; the groups worked in the same month</li></ul></li>
<li><p>Hospital H has a higher overall death rate than hospital K, but a lower rate both for routine and for emergency admissions. H takes most of the region's emergencies. Which hospital has the better record for a given kind of admission?</p><ul><li><b>A.</b> K, because its overall rate is lower</li><li><b>B.</b> Neither: the figures contradict each other</li><li><b>C.</b> H, because it does better within each kind of admission</li><li><b>D.</b> Neither until both treat the same number of patients</li></ul></li>
<li><p>Twenty schools are assigned a reading programme at random, ten each way. The programme schools happen to have slightly more pupils on average. What is the right reading?</p><ul><li><b>A.</b> A chance imbalance: report it; the comparison is still fair on average</li><li><b>B.</b> The randomisation failed and must be redone</li><li><b>C.</b> Any difference in reading scores is caused by the programme</li><li><b>D.</b> The study is now observational</li></ul></li>
<li><p>Clinic A has a higher overall complication rate than clinic B, yet a lower rate within both mild and severe cases. What best explains this?</p><ul><li><b>A.</b> Clinic A treats a much larger share of severe cases</li><li><b>B.</b> Clinic B records complications more carefully</li><li><b>C.</b> Clinic A treats fewer patients in total</li><li><b>D.</b> A arithmetic error: rates within groups must agree with the overall rate</li></ul></li>
<li><p>Randomly assigning a treatment means that any difference between the groups in other characteristics is due to chance.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>Stores that adopted a new scheduling tool sell more per hour than stores that did not. Managers chose whether to adopt it, and larger, busier stores adopted it first. What is the main problem with reading the difference as the tool's effect?</p><ul><li><b>A.</b> The difference may be too small to matter</li><li><b>B.</b> Sales per hour is a skewed measure</li><li><b>C.</b> The tool may not have been used every day</li><li><b>D.</b> Store size affects both adoption and sales per hour</li></ul></li>
</ol>
</section>
<section>
<h2>Week 4: The bootstrap</h2>
<ol>
<li><p>Branches that chose a new oven burn more trays overall, but fewer within both small and large branches. Large branches chose the oven more often and burn more trays with any oven. What is branch size here?</p><ul><li><b>A.</b> The outcome of the comparison</li><li><b>B.</b> A source of random error that averages out</li><li><b>C.</b> The treatment</li><li><b>D.</b> A confounder: it drives both the choice and the burn rate</li></ul></li>
<li><p>A sample of six repair costs is 80, 95, 110, 120, 150, 400. Which of these can be a bootstrap resample of it?</p><ul><li><b>A.</b> 80, 95, 100, 120, 150, 400</li><li><b>B.</b> 95, 110, 400</li><li><b>C.</b> 400, 400, 80, 120, 120, 95</li><li><b>D.</b> The six values in a new order only</li></ul></li>
<li><p>A report says: "The 95% interval for the mean delivery time is 27 to 33 minutes, so 95% of deliveries take between 27 and 33 minutes." What is wrong?</p><ul><li><b>A.</b> Nothing; it should just say 90%</li><li><b>B.</b> The interval should be centred exactly on 30</li><li><b>C.</b> Bootstrap intervals only describe medians</li><li><b>D.</b> It reads an interval for the mean as a range for single deliveries</li></ul></li>
<li><p>A coverage study of a 95% interval method on a long-tailed population gives 0.86 at n = 12 and 0.94 at n = 150, from 1,000 samples each. What is the right conclusion?</p><ul><li><b>A.</b> The method is close to its 95% at n = 150 and too narrow at n = 12</li><li><b>B.</b> The method fails at both sizes, since neither shows exactly 0.95</li><li><b>C.</b> Use more bootstrap resamples at n = 12 and it will reach 0.95</li><li><b>D.</b> The intervals at n = 150 are more often wrong because they are narrower</li></ul></li>
<li><p>A 95% bootstrap interval for the mean basket value is 19.1 to 25.3 riyals. Which reading is correct?</p><ul><li><b>A.</b> 95% of baskets are worth between 19.1 and 25.3 riyals</li><li><b>B.</b> The method gives intervals that contain the population mean in about 95% of samples</li><li><b>C.</b> There is a 95% chance that a new basket falls in the interval</li><li><b>D.</b> The sample mean is 95% likely to lie between 19.1 and 25.3</li></ul></li>
<li><p>A coverage study draws 1,000 samples of 8 values from a long-tailed population and finds that the 95% percentile bootstrap interval for the mean covers the truth 84% of the time. What is the main reason?</p><ul><li><b>A.</b> Small samples rarely contain the tail, so resamples understate the variation</li><li><b>B.</b> The percentile method is only valid for medians</li><li><b>C.</b> Coverage studies always underestimate coverage</li><li><b>D.</b> Too few bootstrap resamples were used</li></ul></li>
<li><p>A bootstrap resample draws the same number of values as the original sample, without replacement.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>Rerunning a bootstrap notebook with a new seed moves the ends of a 95% interval from (12.40, 18.90) to (12.37, 18.95). What should the analyst conclude?</p><ul><li><b>A.</b> The data must have changed between runs</li><li><b>B.</b> The result is unreliable and should not be reported</li><li><b>C.</b> This is resampling noise; report the interval to one decimal and state the resamples used</li><li><b>D.</b> The seed should be chosen to give the narrowest interval</li></ul></li>
</ol>
</section>
<section>
<h2>Week 5: Intervals for differences and slopes</h2>
<ol>
<li><p>An analyst builds a 95% percentile bootstrap interval for the median waiting time from one sample. Which statement about it is correct?</p><ul><li><b>A.</b> 95% of waits fall inside it</li><li><b>B.</b> Its method contains the true median in about 95% of samples, if the method's coverage is right</li><li><b>C.</b> The true median has a 95% chance of being inside this interval</li><li><b>D.</b> 95% of the bootstrap resamples contain the true median</li></ul></li>
<li><p>A table of mean monthly spending by district and age band has one cell of 11 customers whose mean is unusually high. What do you publish for that cell?</p><ul><li><b>A.</b> The mean, flagged as based on few customers</li><li><b>B.</b> The cell merged into its largest neighbour, without saying so</li><li><b>C.</b> "Suppressed", with the count shown only as under 30</li><li><b>D.</b> The median of the 11 instead of their mean</li></ul></li>
<li><p>You want a bootstrap interval for the difference in median call length between two support teams (220 and 90 calls). Which resampling scheme fits?</p><ul><li><b>A.</b> 220 calls with replacement from team one, 90 from team two</li><li><b>B.</b> 310 calls from the pooled calls, split 220 and 90</li><li><b>C.</b> 90 calls from each team</li><li><b>D.</b> 220 and 90 calls without replacement</li></ul></li>
<li><p>You fit the slope of energy use on floor area for 140 buildings and want a bootstrap interval for it. Which draws one resample?</p><ul><li><b>A.</b> 140 areas and, separately, 140 energy values, both with replacement</li><li><b>B.</b> The 140 energy values shuffled against fixed areas</li><li><b>C.</b> 70 buildings drawn without replacement</li><li><b>D.</b> 140 buildings drawn with replacement, each with its own area and energy</li></ul></li>
<li><p>To build a bootstrap interval for the difference in mean repair cost between two depots (60 and 45 jobs), how should each resample be drawn?</p><ul><li><b>A.</b> Draw 45 from each depot so the groups are equal</li><li><b>B.</b> Draw 60 from the first depot without replacement</li><li><b>C.</b> Pool the 105 jobs and draw 105 with replacement</li><li><b>D.</b> Draw 60 with replacement from the first depot and 45 from the second</li></ul></li>
<li><p>For a bootstrap interval of the slope of fuel use on distance, what is resampled?</p><ul><li><b>A.</b> Distances and fuel values separately</li><li><b>B.</b> Whole trips: each distance with its own fuel value</li><li><b>C.</b> Only the fuel values, keeping distances fixed in order</li><li><b>D.</b> Only the residuals of a fit to the shuffled data</li></ul></li>
<li><p>A public table of mean hospital stays by region and age band has one cell with 7 patients. The course's rule suppresses groups under 30 rows. What do you publish for that cell?</p><ul><li><b>A.</b> The median instead of the mean</li><li><b>B.</b> The mean and the count, marked as unreliable</li><li><b>C.</b> The cell marked as suppressed, with the count shown only as under 30</li><li><b>D.</b> The mean rounded to the nearest whole day</li></ul></li>
</ol>
</section>
<section>
<h2>Week 6: Permutation tests</h2>
<ol>
<li><p>Two warehouses' mean picking times have 95% intervals 11.0 to 13.0 and 12.5 to 14.5 minutes. A manager concludes there is no difference because the intervals overlap. What should the analyst do?</p><ul><li><b>A.</b> Agree: overlapping intervals mean no difference</li><li><b>B.</b> Recompute both intervals at 99% to remove the overlap</li><li><b>C.</b> Build a bootstrap interval for the difference itself</li><li><b>D.</b> Pool both warehouses and build one interval</li></ul></li>
<li><p>Thirty stores were randomly given a new price label; thirty kept the old one. To test whether weekly sales differ, what does each permutation do?</p><ul><li><b>A.</b> Resample each group with replacement</li><li><b>B.</b> Shuffle the 60 stores' labels and split them 30 and 30</li><li><b>C.</b> Sort the sales and give the top 30 the new label</li><li><b>D.</b> Add random noise to each store's sales</li></ul></li>
<li><p>A report says: "p = 0.01, so there is only a 1% chance that the new schedule has no effect." Which correction is right?</p><ul><li><b>A.</b> "There is a 99% chance the schedule works."</li><li><b>B.</b> "The schedule improves the outcome by 1%."</li><li><b>C.</b> "If the schedule had no effect, a difference at least this large would arise in about 1% of relabellings."</li><li><b>D.</b> "The result is significant at the 5% level, so the effect is certain."</li></ul></li>
<li><p>A permutation test of two packing methods on 400 boxes gives p = 0.004. Which report follows the course's standard?</p><ul><li><b>A.</b> "Method B is significantly better (p &lt; 0.05)."</li><li><b>B.</b> "p = 0.004 proves method B is better."</li><li><b>C.</b> "Method B is better with 99.6% probability."</li><li><b>D.</b> "B damaged 1.2 fewer boxes per hundred (interval 0.4 to 2.0); shuffles rarely gave a gap this large (p = 0.004)."</li></ul></li>
<li><p>A permutation test of a new layout against the old one gives p = 0.03. Which statement is correct?</p><ul><li><b>A.</b> If the layout had no effect, a difference at least this large would appear in about 3% of shuffles</li><li><b>B.</b> The new layout improves sales by 3%</li><li><b>C.</b> 97% of customers prefer the new layout</li><li><b>D.</b> There is a 3% chance that the new layout has no effect</li></ul></li>
<li><p>With 50,000 rows a permutation test can give a very small p-value for a difference too small to matter.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>To test whether training hours and test scores are associated in 120 employees, what does each permutation do?</p><ul><li><b>A.</b> Sort both columns and pair them in order</li><li><b>B.</b> Drop a random employee and recompute</li><li><b>C.</b> Resample employees with replacement</li><li><b>D.</b> Shuffle the scores against the hours, keeping both columns</li></ul></li>
<li><p>Which report of a permutation test follows the course's standard?</p><ul><li><b>A.</b> "Significant (p &lt; 0.05)."</li><li><b>B.</b> "Visits were 0.8 higher (95% interval 0.5 to 1.1); shuffling the labels rarely gave a gap this large (p = 0.002)."</li><li><b>C.</b> "p = 0.002, which proves the plan works."</li><li><b>D.</b> "The null hypothesis is 99.8% false."</li></ul></li>
</ol>
</section>
<section>
<h2>Week 7: Many tests and forking paths</h2>
<ol>
<li><p>A permutation test of a new checkout layout gives p = 0.21 on 40 shops. A manager writes: "the layout has no effect". What is the best correction?</p><ul><li><b>A.</b> "The data cannot tell at this size; the interval for the effect is wide."</li><li><b>B.</b> "There is a 79% chance the layout works."</li><li><b>C.</b> "The layout makes things worse."</li><li><b>D.</b> "Retest at α = 0.01 to confirm there is no effect."</li></ul></li>
<li><p>A regional report tests 40 districts for a change in complaints after a policy, each at α = 0.05. Two districts show a "significant" change. Assume the policy did nothing. How many would you expect?</p><ul><li><b>A.</b> None, since α is only 5%</li><li><b>B.</b> About 0.05</li><li><b>C.</b> About 2</li><li><b>D.</b> About 32</li></ul></li>
<li><p>A team screens 300 product ideas from survey data to pick some for a costly follow-up trial; a few false picks are acceptable if most picks are real. Which control fits?</p><ul><li><b>A.</b> No correction: each test is at 5%</li><li><b>B.</b> Benjamini-Hochberg, controlling the share of false picks</li><li><b>C.</b> Bonferroni, controlling any false pick at all</li><li><b>D.</b> Test each idea at α = 0.01 instead</li></ul></li>
<li><p>A summary reports that a staff-training course "significantly reduced errors among evening-shift staff over 40 (p = 0.03)". The full data covered all shifts and ages; no subgroup was planned. What is the main problem?</p><ul><li><b>A.</b> Evening staff may be less careful</li><li><b>B.</b> None: p = 0.03 is below 0.05</li><li><b>C.</b> The subgroup is too small for a permutation test</li><li><b>D.</b> A forking path: the subgroup was picked after seeing the data</li></ul></li>
<li><p>A report tests 10 independent outcomes with no true effect, each at α = 0.05. To two decimals, how likely is at least one false finding?</p></li>
<li><p>Six p-values: 0.001, 0.006, 0.012, 0.019, 0.044, 0.31, with α = 0.05. How many does Benjamini-Hochberg reject?</p><ul><li><b>A.</b> 2</li><li><b>B.</b> 3</li><li><b>C.</b> 4</li><li><b>D.</b> 5</li></ul></li>
<li><p>An analyst ran one test, but chose the subgroup, the outcome and the outlier rule after seeing the data. Why is the p-value of that one test misleading?</p><ul><li><b>A.</b> Because the choices that could have been made act like extra tests</li><li><b>B.</b> Because outliers should never be removed</li><li><b>C.</b> Because subgroups are always too small</li><li><b>D.</b> Because a single test has no p-value</li></ul></li>
<li><p>When every tested outcome has no true effect, a false-discovery-rate correction and a family-wise correction control the same error.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Week 8: Error rates, power and honest reporting</h2>
<ol>
<li><p>A safety report makes five claims, each of which would trigger a costly recall. The analyst wants a low chance of even one false claim. Which procedure fits?</p><ul><li><b>A.</b> Benjamini-Hochberg</li><li><b>B.</b> No correction, α = 0.05 each</li><li><b>C.</b> Holm, which controls the family-wise error rate</li><li><b>D.</b> Report only the claim with the smallest p-value</li></ul></li>
<li><p>A pilot with 10 customers per group finds no significant effect of a new menu on spending. A simulation says the test had 18% power for the effect that would matter. What should the report say?</p><ul><li><b>A.</b> The new menu does not change spending</li><li><b>B.</b> The false-finding rate was 82%</li><li><b>C.</b> The new menu reduces spending</li><li><b>D.</b> The pilot was too small to tell; it would miss that effect about four times in five</li></ul></li>
<li><p>A new delivery route must save at least 3 minutes a trip to justify the change. A trial gives a saving of 1.1 minutes, 95% interval 0.6 to 1.6, p &lt; 0.001. What is the decision?</p><ul><li><b>A.</b> Adopt it: the saving is highly significant</li><li><b>B.</b> Do not adopt it: even the top of the interval is below 3 minutes</li><li><b>C.</b> Unclear: run a larger trial</li><li><b>D.</b> Adopt it: p below 0.001 means a large saving</li></ul></li>
<li><p>A note says: "Result: the new rota cut overtime by 6 hours a month (interval 2 to 10). Checked by: an assistant wrote the code. Limits: one region. Reviewer: the team lead." What is the weakest part?</p><ul><li><b>A.</b> "Checked by": it says who wrote the code, not how the result was verified</li><li><b>B.</b> "Result": it should give the p-value instead of the interval</li><li><b>C.</b> "Limits": a limit should never be stated in a report</li><li><b>D.</b> "Reviewer": the analyst should review their own work</li></ul></li>
<li><p>A trial with 15 shops per arm finds "no significant difference" in sales. A simulation shows the test had 20% power for the effect that matters. What should the report say?</p><ul><li><b>A.</b> The Type I error rate was 80%</li><li><b>B.</b> The intervention has no effect</li><li><b>C.</b> The trial could not tell: it would miss an effect that matters four times in five</li><li><b>D.</b> The intervention made sales worse</li></ul></li>
<li><p>A team tests 100 ideas a year; 10 truly work. Tests use α = 0.05 and have power 0.5. About what share of "significant" results are false?</p><ul><li><b>A.</b> About 5%</li><li><b>B.</b> About 10%</li><li><b>C.</b> About 47%</li><li><b>D.</b> About 95%</li></ul></li>
<li><p>As the sample size of a well-built test grows, what happens to its Type I error rate and its power for a fixed real effect?</p><ul><li><b>A.</b> The Type I error rate rises; power stays the same</li><li><b>B.</b> Both rise</li><li><b>C.</b> Both fall</li><li><b>D.</b> The Type I error rate stays near α; power rises</li></ul></li>
<li><p>An offer must lift basket value by at least 2 riyals to pay for itself. A trial gives +2.6 riyals (95% interval 0.4 to 4.8), p = 0.02. What is the right decision statement?</p><ul><li><b>A.</b> Not worth it: the interval includes values below 2</li><li><b>B.</b> Unclear: the interval contains values both below and above 2</li><li><b>C.</b> Worth it: the estimate is above 2</li><li><b>D.</b> Worth it: the result is significant</li></ul></li>
</ol>
</section>
